name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v1.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          version_name="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH, got: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release tag does not exist in the checkout: $RELEASE_TAG" >&2
            exit 1
          fi

          {
            echo "tag=$RELEASE_TAG"
            echo "name=$version_name"
            echo "code=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Restore release signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"
          : "${ANDROID_STORE_PASSWORD:?ANDROID_STORE_PASSWORD secret is required}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
          printf 'storeFile=release-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build signed release APK
        run: >-
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK_PATH: build/app/outputs/flutter-apk/app-release.apk
        shell: bash
        run: |
          set -euo pipefail
          release_asset="account-book-${VERSION_NAME}.apk"
          cp "$APK_PATH" "$release_asset"
          gh release create "$RELEASE_TAG" "$release_asset" \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Clean release signing files
        if: ${{ always() }}
        run: rm -f android/key.properties android/release-key.jks
